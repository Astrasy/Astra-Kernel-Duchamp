name: Build Astra Kernel (GKI 6.1 LTS - Duchamp MT6897)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Sufixo do Kernel (LOCALVERSION)"
        required: false
        type: string
        default: "-Astra"

jobs:
  build-astra-kernel:
    name: "Astra 6.1 LTS (ReSukiSU + SUSFS + BBR + MGLRU)"
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Liberar Espaco em Disco no Runner
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/share/swift \
            /usr/local/lib/node_modules
          df -h

      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias de Compilacao
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl dwarves flex git \
            libelf-dev libssl-dev lz4 openssl perl python3 rsync unzip wget zip zstd

      - name: Inicializar Variaveis e Ferramentas AOSP
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/android14-6.1-lts"
          mkdir -p "$KERNEL_ROOT" "$GITHUB_WORKSPACE/git-repo"

          curl -sL https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

          git config --global user.name "AstraBuilder"
          git config --global user.email "astra@kernel.local"

          git clone https://android.googlesource.com/kernel/prebuilts/build-tools -b main-kernel-build-2024 --depth 1 kernel-build-tools
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg -b main-kernel-build-2024 --depth 1 mkbootimg
          git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 --depth 1 AnyKernel3
          rm -rf AnyKernel3/.git

          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth 1 susfs4ksu
          git clone https://github.com/WildKernels/kernel_patches.git --depth 1 kernel_patches
          git clone https://github.com/Numbersf/Action-Build.git --depth 1 Action-Build

          BOOT_SIGN_KEY="$GITHUB_WORKSPACE/boot_sign_key.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > "$BOOT_SIGN_KEY"

          cat >> "$GITHUB_ENV" << EOF
          KERNEL_ROOT=$KERNEL_ROOT
          REPO=$GITHUB_WORKSPACE/git-repo/repo
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          BOOT_SIGN_KEY=$BOOT_SIGN_KEY
          EOF

      - name: Sincronizar Codigo-Fonte Oficial Google AOSP (common-android14-6.1-lts)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          $REPO init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1-lts --repo-rev=v2.16
          $REPO sync -c -j$(nproc --all) --no-tags --fail-fast

          ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' common/Makefile | awk '{print $3}')
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> "$GITHUB_ENV"
          echo "Kernel Base Sincronizado: 6.1.${ACTUAL_SUBLEVEL}"

      - name: Integrar ReSukiSU + Multi-Manager
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main

      - name: Aplicar Patches SUSFS v2.0.0 & Seguranca VFS
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          SUSFS_VERSION="2.0.0"
          cp "$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" ./common/
          cp "$SUSFS4KSU/kernel_patches/fs/"* ./common/fs/
          cp "$SUSFS4KSU/kernel_patches/include/linux/"* ./common/include/linux/

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

          if [ "${ACTUAL_SUBLEVEL:-177}" -le 138 ] || [ "${ACTUAL_SUBLEVEL:-177}" -ge 145 ]; then
            if [ -f "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch" ]; then
              cp "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch" ./
              patch -p1 < base.c.patch || true
            fi
          fi

          if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
          fi
          if grep -q 'susfs_is_current_proc_umounted' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs.h>' ./fs/proc/base.c; then
            sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs.h>' ./fs/proc/base.c
          fi

          if [ -f "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      - name: Auditar Integridade do MGLRU em mm/readahead.c e Configurar Kernel Astra
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "=== Verificando ausencia do bug de backport MGLRU em mm/readahead.c ==="
          grep -n -C 8 "do_page_cache_ra(" common/mm/readahead.c || true

          # Remove travas estritas de simbolos extras do Kleaf mantendo KMI android14-11 intacta
          sed -i 's/check_defconfig//' ./common/build.config.gki
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' ./common/build.config.gki.aarch64
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' ./common/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' ./common/build.config.gki.aarch64
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl

          # Define sufixo limpo -Astra
          KNAME="${{ inputs.kernel_name || '-Astra' }}"
          sed -i "\$s|echo \"\$res\"|echo \"${KNAME}\"|" ./common/scripts/setlocalversion 2>/dev/null || true

          DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          f="./common/scripts/mkcompile_h"
          if [ -f "$f" ]; then
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
            fi
          fi

          # Cria fragmento de alta eficiencia Astra (ReSukiSU + SUSFS + TCP BBR + FQ + MGLRU Oficial + LZ4)
          FRAG="common/arch/arm64/configs/astra.fragment"
          cat > "$FRAG" << EOF
          CONFIG_LOCALVERSION="${KNAME}"
          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_ZSTD=y
          EOF

          echo "=== Astra Kernel Config Fragment ==="
          cat "$FRAG"

      - name: Compilar Kernel Astra com Clang AOSP Oficial + ThinLTO (Kleaf/Bazel)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          tools/bazel build \
            --config=fast \
            --lto=thin \
            --defconfig_fragment=//common:arch/arm64/configs/astra.fragment \
            //common:kernel_aarch64_dist

          echo "=== Versao Binaria Compilada ==="
          strings ./bazel-bin/common/kernel_aarch64/Image | grep "Linux version" | head -n 3

      - name: Empacotar Boot Image (LZ4 v4 64MB AVB) e AnyKernel3
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/dist_astra"
          SRC_DIR="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64"
          mkdir -p "$OUT_DIR"

          cp "$SRC_DIR/Image" "$OUT_DIR/Image"
          if [ -f "$SRC_DIR/Image.lz4" ]; then
            cp "$SRC_DIR/Image.lz4" "$OUT_DIR/Image.lz4"
          else
            lz4 -l -f -9 "$OUT_DIR/Image" "$OUT_DIR/Image.lz4"
          fi

          # Verifica magic LZ4 Legacy (02 21 4c 18) identico ao boot_a do duchamp
          MAGIC=$(od -An -tx1 -N 4 "$OUT_DIR/Image.lz4" | tr -d ' \n')
          echo "Image.lz4 magic: $MAGIC"
          if [ "$MAGIC" != "02214c18" ]; then
            echo "Recriando Image.lz4 com frame LZ4 Legacy (02214c18)..."
            lz4 -l -f -9 "$OUT_DIR/Image" "$OUT_DIR/Image.lz4"
          fi

          # 1. Cria boot-lz4.img identico ao layout de particao 64MB v4 do POCO X6 Pro / Redmi K70E (duchamp)
          BOOT_IMG="$OUT_DIR/Astra-6.1.${ACTUAL_SUBLEVEL}-duchamp-boot-lz4.img"
          python3 "$MKBOOTIMG" --header_version 4 --kernel "$OUT_DIR/Image.lz4" --output "$BOOT_IMG"
          "$AVBTOOL" add_hash_footer \
            --partition_name boot \
            --partition_size $((64 * 1024 * 1024)) \
            --image "$BOOT_IMG" \
            --algorithm SHA256_RSA2048 \
            --key "$BOOT_SIGN_KEY"

          # 2. Cria AnyKernel3.zip universal GKI 2.0
          sed -i "s|kernel.string=.*|kernel.string=Astra Kernel 6.1.${ACTUAL_SUBLEVEL} (Dimensity 8300-Ultra / BBR + MGLRU + ReSukiSU)|" "$ANYKERNEL3/anykernel.sh"
          cp "$OUT_DIR/Image" "$ANYKERNEL3/Image"
          cd "$ANYKERNEL3"
          zip -r9 "$OUT_DIR/Astra-6.1.${ACTUAL_SUBLEVEL}-duchamp-AnyKernel3.zip" ./*

          ls -lh "$OUT_DIR"

      - name: Publicar Artefatos do Kernel Astra
        uses: actions/upload-artifact@v4
        with:
          name: Astra-Kernel-6.1.${{ env.ACTUAL_SUBLEVEL }}-duchamp
          path: |
            dist_astra/Astra-*-duchamp-boot-lz4.img
            dist_astra/Astra-*-duchamp-AnyKernel3.zip
          if-no-files-found: error
